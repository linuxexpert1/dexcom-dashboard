name: Poll Dexcom

# ONE poll per run: fetch latest Dexcom readings, merge, encrypt, and publish
# readings.enc.json to the `data` branch. Triggered frequently by a launchd
# timer on the Mac (every ~3 min) via `gh workflow run`, which gives a reliable
# cadence that GitHub's own scheduler does not. The hourly cron is a safety net
# so data still refreshes if the Mac is off. Plaintext never leaves the runner.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"   # hourly safety net only

permissions:
  contents: write

concurrency:
  group: poll-dexcom
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet pydexcom cryptography
      - name: Load existing encrypted readings from the data branch
        run: |
          mkdir -p out
          curl -sfL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/readings.enc.json" \
            -o out/readings.enc.json || true
      - name: Poll Dexcom, merge, encrypt
        env:
          DEXCOM_USERNAME: ${{ secrets.DEXCOM_USERNAME }}
          DEXCOM_PASSWORD: ${{ secrets.DEXCOM_PASSWORD }}
          DEXCOM_REGION: ${{ secrets.DEXCOM_REGION }}
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
        run: python scripts/gh_poll.py out/readings.enc.json
      - name: Publish encrypted data to the data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "dexcom-bot"
          git config user.email "actions@users.noreply.github.com"
          git add readings.enc.json
          git commit -q -m "Update readings $(date -u +%FT%TZ) [skip ci]"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" data
